services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: grid
      POSTGRES_PASSWORD: grid
      POSTGRES_DB: grid
    ports:
      - "5432:5432"
    volumes:
      - grid_pgdata:/var/lib/postgresql/data
      - ./scripts/ingest/schema-rf.sql:/docker-entrypoint-initdb.d/01-schema-rf.sql:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid -d grid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grid_pgdata:
