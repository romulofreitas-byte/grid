<!--
  Cole no Supabase hospedado → Authentication → Emails → Templates.
  O href usa token_hash (não ConfirmationURL) para o clique no Gmail
  não depender do cookie PKCE do navegador que pediu o link.
-->

<!-- Confirm sign up — assunto: Confirme o e-mail para acessar o GRID -->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#0B1A2E;padding:32px 16px;">
  <tr>
    <td align="center">
      <img src="https://grid.mundopodium.com.br/brand/grid-email.png" alt="GRID · Mundo Pódium" width="240" style="display:block;border:0;width:240px;height:auto;margin:0 0 20px;" />
      <table width="480" cellpadding="0" cellspacing="0" role="presentation" style="background:#12263F;border-radius:16px;padding:32px 32px 28px;">
        <tr>
          <td>
            <p style="margin:0 0 24px;font:16px Arial,sans-serif;color:#C5CDD8;line-height:1.5;">
              Confirme o e-mail para acessar o GRID.
            </p>
            <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=signup" style="display:inline-block;background:#F5B301;color:#0B1A2E;font:800 14px Arial,sans-serif;text-decoration:none;padding:14px 28px;border-radius:12px;">
              Confirmar e-mail
            </a>
            <p style="margin:28px 0 0;font:12px Arial,sans-serif;color:#7A8494;line-height:1.4;">
              Se não pediu esta conta, ignore o e-mail.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<!-- Reset password — assunto: Defina sua senha no GRID -->
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#0B1A2E;padding:32px 16px;">
  <tr>
    <td align="center">
      <img src="https://grid.mundopodium.com.br/brand/grid-email.png" alt="GRID · Mundo Pódium" width="240" style="display:block;border:0;width:240px;height:auto;margin:0 0 20px;" />
      <table width="480" cellpadding="0" cellspacing="0" role="presentation" style="background:#12263F;border-radius:16px;padding:32px 32px 28px;">
        <tr>
          <td>
            <p style="margin:0 0 24px;font:16px Arial,sans-serif;color:#C5CDD8;line-height:1.5;">
              Clique para definir a senha dos próximos acessos.
            </p>
            <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;background:#F5B301;color:#0B1A2E;font:800 14px Arial,sans-serif;text-decoration:none;padding:14px 28px;border-radius:12px;">
              Definir senha
            </a>
            <p style="margin:28px 0 0;font:12px Arial,sans-serif;color:#7A8494;line-height:1.4;">
              Se não pediu esta troca, ignore o e-mail.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
