# Railway worker — enrichment always-on (not the Next.js app).
# In the Railway dashboard: Settings → Start command can stay as below.

[build]
builder = "NIXPACKS"

# Nixpacks reads .nvmrc / nixpacks.toml (Node 20). Node 18 crashes undici 7
# with "File is not defined".

[deploy]
startCommand = "pnpm worker:dev"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
